  lottie: ^3.3.0
  shared_preferences: ^2.0.8
  http: ^1.1.0
  permission_handler: ^12.0.0+1
  pinput: ^6.0.2
  carousel_slider: ^5.0.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  image_picker: ^1.0.7
  flutter_intl_phone_field: ^0.0.7
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.3
  fluttertoast: ^9.1.0
  fl_chart: ^1.2.0
  path_provider: ^2.0.15
  chat_bubbles: ^1.6.0
  timeago: ^3.6.0 
  path: ^1.8.3
  flutter_slidable: ^4.0.3
  dio: ^5.4.1
  clipboard: ^3.0.14
  form_builder_validators: ^11.1.2
  flutter_form_builder: ^10.3.0+2
  syncfusion_flutter_sliders: ^33.2.7
  video_player: ^2.8.6
  vibration: ^3.1.8
