name: Frutia
description: A new Flutter project.
publish_to: "none"

version: 1.0.01+2

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  google_fonts: ^8.1.0
  confetti: ^0.8.0   
  firebase_core: ^4.9.0
  provider: ^6.1.2
  firebase_analytics: ^12.4.1
  flutter_dotenv: ^6.0.1
  card_swiper: ^3.0.1
