  flutter_tex: ^5.2.7
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  flutter_chat_bubble: ^2.0.2
  audio_session: ^0.2.3
  audioplayers: ^6.5.1
  pusher_channels_flutter: ^2.6.0
  smooth_page_indicator: ^2.0.1 
  firebase_auth: ^6.5.1
  country_picker: ^2.0.26
  collection: ^1.18.0
  showcaseview: ^5.0.2
  onesignal_flutter: ^5.3.3
  pdf: ^3.10.8
  printing: ^5.11.1
  share_plus: ^13.1.0
  open_file: ^3.5.10
  flutter_custom_tabs: ^2.4.0
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/fondoFrutia.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/icons/
    - assets/grid/
    - assets/map_style.json
    - assets/logos/
    - assets/fonts/
    - assets/sonidos/
    - .env